# Build on GitHub, deploy to AWS (S3 + CloudFront) with eras-tcg/infra deploy-site-aws.yml.
#   PR to main   -> lint + test + build only
#   push to main -> build (configuration "aws") + deploy staging.erastcg.com + deploy erastcg.com (waits for approval)
#   Rollback     -> re-run the deploy job of an earlier run (its build artifact is kept 90 days)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One build for both environments: the API and /wake are relative to the site's own domain.
      - run: npx ng build --configuration aws
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/eras-web/browser
          retention-days: 90

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: eras-tcg/infra/.github/workflows/deploy-site-aws.yml@main
    secrets: inherit
    with:
      environment: staging
      artifact: site

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    uses: eras-tcg/infra/.github/workflows/deploy-site-aws.yml@main
    secrets: inherit
    with:
      environment: production
      artifact: site
