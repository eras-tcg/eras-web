# Build on GitHub, publish to GHCR, deploy to next.erastcg.com (eras-tcg/infra, self-hosted runner).
# eras-web only targets the "next" environment until parity with the Vue app is reached
# (see PLAN_MIGRACION_FRONT_ANGULAR.md, fase 7); it validates against the staging backend.
#   PR to main      -> build + lint + test only
#   push to main     -> build image + deploy to next
#   Run workflow     -> redeploy an existing image (rollback)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/eras-web:${{ github.sha }}-next
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/eras-web:${{ github.sha }}-next
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-next:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: eras-web
      environment: next
      image: ${{ needs.build.outputs.image }}
      nginx_vhost: nginx/next.erastcg.com

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: eras-web
      environment: next
      image: ghcr.io/eras-tcg/eras-web:${{ inputs.image_tag }}-next
      nginx_vhost: nginx/next.erastcg.com
