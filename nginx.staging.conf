server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    # The code, the engine's data (/engine/*.json, ~1 MB) and the manifest go compressed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # --- WebSocket (simulator) ---
    location /ws {
        set $upstream http://drive-manager-staging:8081;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # --- DriveManager ---
    location /api/drive/ {
        set $upstream http://drive-manager-staging:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/simulator/ {
        set $upstream http://drive-manager-staging:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/cards/ {
        set $upstream http://drive-manager-staging:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- UsersService ---
    location /api/auth/ {
        set $upstream http://users-service-staging:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        set $upstream http://users-service-staging:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/roles/ {
        set $upstream http://users-service-staging:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/permissions/ {
        set $upstream http://users-service-staging:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Files whose name carries the build's hash never change: kept for good (esbuild's hashes mix cases, - and _)
    location ~ "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and what it decides with (its manifest, the app's index, the web manifest): always
    # revalidated, so a deploy reaches installed apps at once
    location ~ ^/(ngsw\.json|ngsw-worker\.js|eras-sw\.js|safety-worker\.js|worker-basic\.min\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback. index.html (and the rest: /engine/*.json, icons, fonts) is revalidated every time, so a deploy is
    # seen at once. The service worker never caches /api, /ws or /wake (ngsw-config.json)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
