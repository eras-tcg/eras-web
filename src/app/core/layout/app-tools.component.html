@if (auth.user()) {
  @if (editMode.allows('manage_users')) {
    <!-- Edit mode: the gems can be set (to test the shop) -->
    <button type="button" class="item gems editable" [attr.aria-label]="wallet.gems() + ' gemas, editar'" title="Editar las gemas" (click)="editGems()">
      <eras-icon name="gem" /><span class="label">{{ wallet.gems() | number: '1.0-0' : 'es' }}</span>
    </button>
  } @else {
    <a class="item gems" routerLink="/editions" [attr.aria-label]="wallet.gems() + ' gemas, ir a la tienda'">
      <eras-icon name="gem" /><span class="label">{{ wallet.gems() | number: '1.0-0' : 'es' }}</span>
    </a>
  }
  <a class="item missions" routerLink="/missions" [attr.aria-label]="missions.waiting() ? 'Misiones: ' + missions.waiting() + ' por reclamar' : 'Misiones'">
    <eras-icon name="target" /><span class="label">Misiones</span>
    @if (missions.waiting()) {
      <span class="badge">{{ missions.waiting() }}</span>
    }
  </a>
  @if (editMode.available()) {
    <button type="button" class="item" role="switch" [class.on]="editMode.active()" [attr.aria-checked]="editMode.active()" (click)="editMode.toggle()">
      <eras-icon name="edit" /><span class="label">Modo edición</span>
    </button>
  }
  @if (home() && isAdmin()) {
    <a class="item" routerLink="/admin"><eras-icon name="shield" /><span class="label">Administración</span></a>
  }
  @if (home()) {
    <button type="button" class="item" (click)="signOut()"><eras-icon name="logout" /><span class="label">Salir</span></button>
  }
} @else {
  <!-- Signed out there is no profile to keep the theme in: it stays here -->
  <button type="button" class="item" (click)="theme.toggle()">
    <eras-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
    <span class="label">{{ theme.theme() === 'dark' ? 'Tema claro' : 'Tema oscuro' }}</span>
  </button>
}
