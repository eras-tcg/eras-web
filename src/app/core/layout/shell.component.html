<header class="header">
  <div class="bar">
    <a class="brand" routerLink="/">ERAS</a>

    <button
      erasButton
      variant="ghost"
      size="sm"
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      aria-label="Menú"
      (click)="menuOpen.set(!menuOpen())"
    >
      <eras-icon name="menu" />
    </button>

    <nav id="main-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Principal">
      <ul class="links">
        @for (item of nav; track item.label) {
          <li>
            @if (item.route) {
              <a [routerLink]="item.route" routerLinkActive="is-active" (click)="menuOpen.set(false)">{{ item.label }}</a>
            } @else {
              <a [href]="href(item)">{{ item.label }}</a>
            }
          </li>
        }
      </ul>

      <div class="tools">
        <button
          erasButton
          variant="ghost"
          size="sm"
          type="button"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'"
          (click)="theme.toggle()"
        >
          <eras-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
        </button>

        @if (auth.user(); as user) {
          <a class="user" routerLink="/profile" aria-label="Mi perfil" (click)="menuOpen.set(false)"><eras-icon name="user" /> {{ user.username }}</a>
          <button erasButton variant="secondary" size="sm" type="button" (click)="logout()">
            <eras-icon name="logout" /> Salir
          </button>
        } @else {
          <a erasButton variant="primary" size="sm" routerLink="/login" (click)="menuOpen.set(false)">Iniciar sesión</a>
        }
      </div>
    </nav>
  </div>
</header>

<main class="main">
  <router-outlet />
</main>
