<header class="header" [class.compact]="compact()" [class.hub]="hub()">
  <!-- The home hub draws its own top row: the header keeps only the banners there -->
  @if (!hub()) {
    <div class="bar">
      @if (auth.user()) {
        <a class="back" routerLink="/home" aria-label="Volver al inicio">
          <eras-icon name="chevron-left" />
          <img class="logo" src="favicon.svg" alt="" />
          <span class="back-text">Inicio</span>
        </a>
      } @else {
        <span class="brand"><img class="logo" src="favicon.svg" alt="" /><span class="brand-text">ERAS</span></span>
      }
      <eras-app-tools class="tools" />
    </div>
  }

  @if (version.updateAvailable()) {
    <div class="update-banner" role="status">
      <eras-icon name="refresh" /> Hay una versión nueva de ERAS.
      <button type="button" class="update-reload" (click)="version.reload()">Recargar</button>
    </div>
  }
  @if (editMode.active()) {
    <div class="edit-banner" role="status">
      <eras-icon name="edit" /> Modo edición activo: los controles para editar el contenido están visibles.
    </div>
  }
</header>

<main class="main">
  <router-outlet />
</main>
