<eras-auth-layout heading="Iniciar sesión">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <eras-stack [gap]="4">
      @if (auth.expired() && !error()) {
        <eras-alert>Tu sesión expiró. Vuelve a iniciar sesión para seguir donde estabas.</eras-alert>
      }
      @if (error(); as message) {
        <eras-alert tone="danger">{{ message }}</eras-alert>
      }
      <eras-form-field
        label="Usuario"
        required
        [error]="form.controls.username.touched && form.controls.username.invalid ? 'Ingresa tu usuario' : null"
      >
        <input formControlName="username" autocomplete="username" />
      </eras-form-field>
      <eras-form-field
        label="Contraseña"
        required
        [error]="!form.controls.password.touched ? null : form.controls.password.hasError('required') ? 'Ingresa tu contraseña' : form.controls.password.hasError('minlength') ? 'La contraseña tiene al menos 8 caracteres' : null"
      >
        <input type="password" formControlName="password" autocomplete="current-password" />
      </eras-form-field>
      <button erasButton type="submit" [loading]="loading()">Entrar</button>
    </eras-stack>
  </form>
  <eras-version-tag auth-footer />
</eras-auth-layout>
