<eras-page title="Crear cuenta" width="narrow">
  <eras-card padding="lg">
    @if (done()) {
      <eras-stack [gap]="4">
        <eras-alert tone="success">
          Tu cuenta fue creada. Te enviamos un correo para validarla; ábrelo antes de iniciar sesión.
        </eras-alert>
        <a erasButton routerLink="/login">Ir a iniciar sesión</a>
      </eras-stack>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <eras-stack [gap]="4">
          @if (error(); as message) {
            <eras-alert tone="danger">{{ message }}</eras-alert>
          }
          <eras-form-field label="Usuario" required [error]="errorFor('username')">
            <input formControlName="username" autocomplete="username" (input)="clearServerError('username')" />
          </eras-form-field>
          <eras-form-field label="Correo" required [error]="errorFor('email')">
            <input type="email" formControlName="email" autocomplete="email" (input)="clearServerError('email')" />
          </eras-form-field>
          <eras-form-field label="Contraseña" required [error]="errorFor('password')">
            <input type="password" formControlName="password" autocomplete="new-password" (input)="clearServerError('password')" />
          </eras-form-field>
          <eras-form-field label="Repetir contraseña" required [error]="errorFor('confirm')">
            <input type="password" formControlName="confirm" autocomplete="new-password" />
          </eras-form-field>
          <button erasButton type="submit" [loading]="loading()" [disabled]="loading()">Crear cuenta</button>
          <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
        </eras-stack>
      </form>
    }
  </eras-card>
</eras-page>
