@let v = view();
<button erasButton variant="secondary" type="button" class="nav prev" aria-label="Carta anterior" [disabled]="!hasPrevious()" (click)="move(-1)">
  <eras-icon name="chevron-left" />
</button>

<div class="panel" role="document">
  <button erasButton variant="ghost" size="sm" type="button" class="close" aria-label="Cerrar" (click)="ref.close()">
    <eras-icon name="x" />
  </button>

  <eras-card-detail
    [name]="v.name"
    [edition]="v.edition"
    [number]="v.number"
    [color]="v.color"
    [colorLabel]="v.colorLabel"
    [imageUrl]="v.imageUrl"
    [facts]="v.facts"
    [textGroups]="v.groups"
    [notice]="v.notice"
    [printings]="variants().length"
    [hasPreviousPrinting]="variantIndex() > 0"
    [hasNextPrinting]="variantIndex() < variants().length - 1"
    (previousPrinting)="switchPrinting(-1)"
    (nextPrinting)="switchPrinting(1)"
  >
    <ng-container ngProjectAs="[detail-actions]">
      <ng-container *erasCan="'manage_cards'">
        @if (actionError(); as message) {
          <eras-alert tone="danger">{{ message }}</eras-alert>
        }
        <button erasButton variant="secondary" size="sm" type="button" [disabled]="busy()" (click)="editMeta()">
          <eras-icon name="edit" /> {{ card().meta ? 'Editar metadatos' : 'Crear metadatos' }}
        </button>
        <button erasButton variant="ghost" size="sm" type="button" [disabled]="busy()" (click)="rename()">Renombrar</button>
        @if (card().meta) {
          <button erasButton variant="ghost" size="sm" type="button" [disabled]="busy()" (click)="remove('meta')">Eliminar metadatos</button>
        }
        <button erasButton variant="ghost" size="sm" type="button" [disabled]="busy()" (click)="remove('image')">Eliminar imagen</button>
        @if (card().meta) {
          <button erasButton variant="danger" size="sm" type="button" [disabled]="busy()" (click)="remove('both')">Eliminar todo</button>
        }
      </ng-container>
    </ng-container>
  </eras-card-detail>
</div>

<button erasButton variant="secondary" type="button" class="nav next" aria-label="Carta siguiente" [disabled]="!hasNext()" (click)="move(1)">
  <eras-icon name="chevron-right" />
</button>
