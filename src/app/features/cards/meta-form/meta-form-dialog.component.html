@let v = f();
<eras-modal [title]="data.metaId ? 'Editar metadatos' : 'Nuevos metadatos'" [subtitle]="v.cardName || null" (closed)="ref.close()">
  <eras-split aside="12rem">
    <div split-aside>
      <eras-card-image [src]="data.imageUrl" [alt]="v.cardName" eager />
    </div>

    <eras-stack [gap]="4">
      @for (e of errors(); track e) {
        <eras-alert tone="danger">{{ e }}</eras-alert>
      }

      <eras-meta-fields [(form)]="f" [refData]="data.ref" />
    </eras-stack>
  </eras-split>

  <ng-container modal-footer>
    <button erasButton variant="secondary" type="button" (click)="ref.close()">Cancelar</button>
    <button erasButton type="button" [loading]="saving()" [disabled]="saving()" (click)="save()">Guardar metadatos</button>
  </ng-container>
</eras-modal>
