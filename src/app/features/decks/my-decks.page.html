<eras-page title="Mazos" width="wide" fill>
  @if (store.error(); as error) {
    <eras-alert tone="danger">{{ error }}</eras-alert>
  }
  @if (actionError(); as error) {
    <eras-alert tone="danger">{{ error }}</eras-alert>
  }

  <eras-deck-browser
    showVisibility
    [(filters)]="filters"
    [(sortKey)]="sortKey"
    [(direction)]="direction"
    [sortOptions]="sortOptions"
    [editions]="editions()"
    [shown]="decks().length"
    [total]="store.myDecks().length"
    [loading]="store.loading() && store.myDecks().length === 0"
    [note]="note()"
  >
    <a *erasCan="'manage_decks'" deck-lead class="new-deck" routerLink="/deck-builder">
      <span class="new-ring" aria-hidden="true"><eras-icon name="plus" /></span>
      <span class="new-label">Nuevo mazo</span>
    </a>
    @for (deck of decks(); track deck.id) {
      <eras-deck-cover
        [name]="deck.deckName"
        [imageUrl]="deck.deckImage ?? null"
        [cardCount]="deck.cards.length"
        [isPrivate]="!!deck.privateDeck"
        [isPublic]="!deck.privateDeck"
        (selected)="view(deck)"
      >
        <ng-container ngProjectAs="[cover-actions]">
          <ng-container *erasCan="'manage_decks'">
            <a erasButton variant="secondary" size="sm" routerLink="/deck-builder" [queryParams]="editQuery(deck)" [attr.aria-label]="'Editar ' + deck.deckName">
              <eras-icon name="edit" />
            </a>
            <button
              erasButton
              variant="secondary"
              size="sm"
              type="button"
              [attr.aria-label]="'Borrar ' + deck.deckName"
              [disabled]="deleting() === deck.id"
              (click)="remove(deck)"
            >
              <eras-icon name="x" />
            </button>
          </ng-container>
        </ng-container>
      </eras-deck-cover>
    }
  </eras-deck-browser>
</eras-page>
