<eras-page title="Mazos" width="wide" fill>
  @if (store.error(); as error) {
    <eras-alert tone="danger">{{ error }}</eras-alert>
  }

  <eras-deck-browser
    showVisibility
    [(filters)]="filters"
    [(sortKey)]="sortKey"
    [(direction)]="direction"
    [sortOptions]="sortOptions"
    [editions]="editions()"
    [shown]="decks().length"
    [total]="store.myDecks().length"
    [loading]="store.loading() && store.myDecks().length === 0"
    [note]="note()"
  >
    <a *erasCan="'manage_decks'" deck-lead class="new-deck" routerLink="/deck-builder">
      <span class="new-ring" aria-hidden="true"><eras-icon name="plus" /></span>
      <span class="new-label">Nuevo mazo</span>
    </a>
    @for (deck of decks(); track deck.id) {
      <eras-deck-cover
        [name]="deck.deckName"
        [imageUrl]="deck.deckImage ?? null"
        [foil]="coverShine(deck)"
        [cardCount]="deck.cards.length"
        [isPrivate]="!!deck.privateDeck"
        [isPublic]="!deck.privateDeck"
        (selected)="view(deck)"
      />
    }
  </eras-deck-browser>
</eras-page>
