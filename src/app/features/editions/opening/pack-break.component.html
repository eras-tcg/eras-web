<!-- Behind: turning rays and a glow, one step stronger with each blow -->
<span class="rays"></span>
<span class="glow"></span>

<!-- The pack: three blows, each a jolt and a stage of cracks with light leaking through; it swells, freezes, and is gone -->
<span class="body">
  <span class="art"></span>
  <!-- The light from inside, growing with each blow, and along the edges once it swells -->
  <span class="inner" [style.--ix]="impact.x + '%'" [style.--iy]="impact.y + '%'"></span>
  <svg class="cracks" [attr.viewBox]="viewBox" preserveAspectRatio="none">
    @for (stage of cracks; track $index; let s = $index) {
      <!-- Wide and blurred first (the light through the crack), then the crack itself -->
      <g [class]="'leak stage-' + s">
        @for (d of stage; track $index) {
          <path pathLength="1" [attr.d]="d" />
        }
      </g>
      <g [class]="'line stage-' + s">
        @for (d of stage; track $index) {
          <path pathLength="1" [attr.d]="d" />
        }
      </g>
    }
  </svg>
</span>

<!-- The shatter: a flash and a shock wave from the impact (the shards, flecks and sparks are on the canvas) -->
<span class="flash" [style.--ix]="impact.x + '%'" [style.--iy]="impact.y + '%'"></span>
<span class="wave" [style.--ix]="impact.x + '%'" [style.--iy]="impact.y + '%'"></span>
<canvas #burst class="burst"></canvas>
