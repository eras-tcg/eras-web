<!-- Behind: turning rays, growing while it charges -->
<span class="rays"></span>

<!-- The pack, as its shards (together they are the whole pack): it shakes (its glow with it), cracks, then they fly -->
<span class="body">
  <span class="glow"></span>
  @for (shard of shards; track $index) {
    <span class="shard" [style.clip-path]="'polygon(' + shard.clip + ')'" [style.--dx]="shard.dx + '%'" [style.--dy]="shard.dy + '%'" [style.--rot]="shard.rot + 'deg'"></span>
  }
  <svg class="cracks" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path pathLength="1" d="M50 45 L40 0 M50 45 L75 0 M50 45 L100 25 M50 45 L100 60 M50 45 L70 100 M50 45 L30 100 M50 45 L0 70 M50 45 L0 30" />
    <path pathLength="1" class="thin" d="M44 20 L30 14 M62 22 L72 30 M70 52 L82 48 M58 72 L66 80 M40 70 L28 76 M30 42 L18 50" />
  </svg>
</span>

<!-- The break: a flash and sparks -->
<span class="flash"></span>
@for (spark of sparks; track $index) {
  <span class="spark" [style.--angle]="spark.angle + 'deg'" [style.--dist]="spark.dist + 'px'" [style.--size]="spark.size + 'px'"></span>
}
