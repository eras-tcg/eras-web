<div class="art" aria-hidden="true" [style.background-image]="background()?.editionImage ? 'url(' + background()!.editionImage + ')' : null"></div>

<header class="top">
  @if (title(); as name) {
    <div class="heading">
      <a class="back" routerLink="/home" aria-label="Volver al inicio"><eras-icon name="chevron-left" /> Inicio</a>
      <h1 class="title">{{ name }}</h1>
    </div>
  } @else if (auth.user(); as user) {
    <a class="player" routerLink="/profile" aria-label="Mi perfil">
      <eras-avatar class="player-avatar" [url]="avatar.url()" [name]="user.username" />
      <span class="player-text">
        <span class="player-name">{{ user.username }}</span>
        <span class="player-meta">{{ playerMeta() ?? 'Jugador de ERAS' }}</span>
      </span>
    </a>
  }

  <eras-app-tools class="quick" onArt [home]="!title()" />
</header>

<div class="side">
  <ng-content />
</div>

@if (background(); as art) {
  <button type="button" class="credit" (click)="openCards(art.editionId)">
    <eras-icon name="image" /> {{ art.editionName || art.editionId }}
  </button>
}
