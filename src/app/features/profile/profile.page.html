<eras-page title="Mi perfil" fill>
  <!-- Your games: a view of their own -->
  <a page-actions erasButton variant="secondary" size="sm" routerLink="/profile/history"><eras-icon name="history" /> Historial de partidas</a>

  <div class="layout">
    <!-- Who you are and where you stand: icon, name and rank over your banner (the icon and the banner change here) -->
    <eras-profile-hero [username]="username()" />

    <!-- Your preferences (the site's look and the table's, your playmat; kept with your account) beside your account -->
    <div class="profile">
      <eras-card padding="md" class="preferences">
        <eras-section-header title="Preferencias" />
        <eras-game-preferences-panel withInterface withPlaymat />
      </eras-card>

      <eras-card padding="md" class="account">
        <eras-stack [gap]="4">
          <eras-section-header title="Cuenta" />
          @if (canEditAccount()) {
            @if (accountLoading()) {
              <eras-spinner />
            } @else {
              <form [formGroup]="accountForm" (ngSubmit)="saveAccount()">
                <eras-stack [gap]="3">
                  @if (accountFeedback(); as f) {
                    <eras-alert [tone]="f.tone">{{ f.text }}</eras-alert>
                  }
                  <eras-form-field
                    label="Usuario"
                    required
                    [error]="accountForm.controls.username.touched && accountForm.controls.username.invalid ? 'Ingresa un nombre de usuario' : null"
                  >
                    <input formControlName="username" autocomplete="username" />
                  </eras-form-field>
                  <eras-form-field
                    label="Correo"
                    required
                    [error]="accountForm.controls.email.touched && accountForm.controls.email.invalid ? 'Ingresa un correo válido' : null"
                  >
                    <input type="email" formControlName="email" autocomplete="email" />
                  </eras-form-field>
                  <button erasButton type="submit" class="start" [loading]="accountSaving()" [disabled]="accountSaving()">Guardar cuenta</button>
                </eras-stack>
              </form>
            }
          } @else {
            <eras-form-field label="Usuario" hint="Por ahora el usuario y el correo solo los puede cambiar un administrador.">
              <input [value]="username()" readonly />
            </eras-form-field>
          }

          <!-- The password, folded until it is needed -->
          <details class="password" [open]="!!passwordFeedback()">
            <summary>Cambiar contraseña</summary>
            <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
              <eras-stack [gap]="3">
                @if (passwordFeedback(); as f) {
                  <eras-alert [tone]="f.tone">{{ f.text }}</eras-alert>
                }
                <!-- Hidden username helps password managers update the right entry -->
                <input type="text" autocomplete="username" [value]="username()" hidden aria-hidden="true" />
                <eras-form-field label="Contraseña actual" required [error]="passwordError('oldPassword')">
                  <input type="password" formControlName="oldPassword" autocomplete="current-password" />
                </eras-form-field>
                <eras-form-field label="Nueva contraseña" required [error]="passwordError('newPassword')">
                  <input type="password" formControlName="newPassword" autocomplete="new-password" (input)="newPasswordServerError.set(null)" />
                </eras-form-field>
                <eras-form-field label="Repetir nueva contraseña" required [error]="passwordError('confirm')">
                  <input type="password" formControlName="confirm" autocomplete="new-password" />
                </eras-form-field>
                <button erasButton type="submit" class="start" [loading]="passwordSaving()" [disabled]="passwordSaving()">Cambiar contraseña</button>
              </eras-stack>
            </form>
          </details>
        </eras-stack>
      </eras-card>
    </div>
  </div>
</eras-page>
