<eras-modal size="xl" [title]="data.only ? 'Separar ' + labels[data.only].toLowerCase() : (slot()?.cardName ?? 'Carta')" (closed)="ref.close()">
  @if (slot(); as s) {
    <eras-stack [gap]="4">
      @if (!data.only) {
        <eras-card-sheet [slot]="s" [zone]="data.zone" [opponent]="data.opponent" />
      }
      @for (type of groups(); track type) {
        <eras-section-header [title]="labels[type] + ' (' + s[type].length + ')'" />
        <eras-stack direction="row" [gap]="3" wrap>
          @for (a of s[type]; track a.instanceId; let i = $index) {
            <div class="attached">
              <eras-game-card small [imageUrl]="a.imageUrl" [foil]="a.finish ?? null" [name]="a.cardName ?? null" [hidden]="a.faceDown" [attr.aria-label]="a.cardName" />
              @if (!data.readonly) {
                <!-- "Enviar a…": on the card's lower right corner -->
                <button type="button" class="send" [attr.aria-label]="'Enviar ' + (a.cardName ?? 'el anexo') + ' a…'" (click)="sendAttachment(s, a, type, i)">
                  <eras-icon name="external" />
                </button>
              }
            </div>
          }
        </eras-stack>
      }
    </eras-stack>
  } @else {
    <eras-empty-state title="La carta ya no está en esa zona" />
  }
</eras-modal>
