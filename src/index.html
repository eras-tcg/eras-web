<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ERAS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2A5274">
  <!-- Installed on the home screen it opens without the browser bars (iPhone has no full screen for pages) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ERAS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // The site lives on www.erastcg.com only (one origin for the installed app and its offline data). CloudFront
    // answers erastcg.com with a 301; this covers a page still cached there. Offline it stays put and keeps working.
    if (location.hostname === 'erastcg.com' && navigator.onLine) {
      location.replace('https://www.erastcg.com' + location.pathname + location.search + location.hash);
    }
    // "Instalar ERAS" (core/pwa/install-prompt.ts): the browser may offer the installation before the app has started
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__erasInstallPrompt = e; });
    addEventListener('appinstalled', function () { window.__erasInstallPrompt = null; window.__erasInstalled = true; });
  </script>
</head>
<body>
  <eras-root></eras-root>
</body>
</html>
